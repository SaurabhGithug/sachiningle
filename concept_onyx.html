<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sachin Ingle | Onyx Concept</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Premium Fonts: Cormorant Garamond (Serif) + Outfit (Sans) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'onyx-black': '#050505',
                        'onyx-charcoal': '#1A1A1A',
                        'onyx-gold': '#D4AF37',
                    },
                    fontFamily: {
                        'sans': ['Outfit', 'sans-serif'],
                        'serif': ['Cormorant Garamond', 'serif'],
                    },
                    backgroundImage: {
                        'gold-gradient': 'linear-gradient(135deg, #F9F1D0 0%, #D4AF37 50%, #B69121 100%)',
                        'dark-gradient': 'radial-gradient(circle at 50% 50%, #1a1a1a 0%, #050505 100%)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050505;
            color: #E5E5E5;
            overflow-x: hidden;
        }

        /* Gold Gradient Text */
        .text-gold-gradient {
            background: linear-gradient(135deg, #F9F1D0 0%, #D4AF37 50%, #B69121 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Spotlight Effect */
        .spotlight-overlay {
            background: radial-gradient(600px circle at var(--x) var(--y), rgba(212, 175, 55, 0.05), transparent 40%);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        /* Fade Up Animation */
        .fade-up {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s ease-out, transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .fade-up.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Gradient Border */
        .gradient-border-bottom {
            position: relative;
        }

        .gradient-border-bottom::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.5), transparent);
        }
    </style>
</head>

<body class="antialiased">

    <!-- Spotlight Effect -->
    <div class="spotlight-overlay"></div>

    <!-- Navigation -->
    <nav
        class="fixed top-0 w-full z-50 px-8 lg:px-16 py-8 flex justify-between items-center bg-onyx-black/50 backdrop-blur-md border-b border-white/5">
        <div class="font-serif text-3xl text-gold-gradient tracking-wider">Sachin Ingle</div>
        <div class="hidden md:flex gap-10 text-xs uppercase tracking-[0.15em] text-neutral-400">
            <a href="#" class="hover:text-onyx-gold transition-colors duration-300">Portfolio</a>
            <a href="#" class="hover:text-onyx-gold transition-colors duration-300">Expertise</a>
            <a href="#" class="hover:text-onyx-gold transition-colors duration-300">Contact</a>
        </div>
    </nav>

    <main class="relative pt-32 min-h-screen">

        <div class="max-w-[1600px] mx-auto px-8 lg:px-16 grid lg:grid-cols-2 gap-16 items-center min-h-[80vh]">

            <!-- Left: Typography & Cards -->
            <div class="space-y-12 relative z-10">
                <div class="inline-block px-4 py-1 rounded-full border border-white/10 bg-white/5 backdrop-blur-sm fade-up"
                    style="transition-delay: 0.1s">
                    <span class="text-xs uppercase tracking-widest text-onyx-gold">Premium Development</span>
                </div>

                <h1 class="font-serif text-6xl lg:text-8xl leading-tight text-white fade-up"
                    style="transition-delay: 0.2s">
                    Architecting <br>
                    <span class="text-gold-gradient italic">Timeless Legacies</span>
                </h1>

                <p class="text-lg font-light text-neutral-400 max-w-lg leading-relaxed fade-up"
                    style="transition-delay: 0.3s">
                    A curated approach to land development in Nagpur. We transform prestigious coordinates into
                    landmarks of enduring value.
                </p>

                <div class="flex gap-6 fade-up" style="transition-delay: 0.4s">
                    <button
                        class="px-8 py-4 bg-white text-black text-xs uppercase tracking-widest font-medium hover:bg-onyx-gold transition-colors duration-300">
                        View Projects
                    </button>
                    <button
                        class="px-8 py-4 border border-white/20 text-white text-xs uppercase tracking-widest font-medium hover:border-onyx-gold hover:text-onyx-gold transition-colors duration-300">
                        Get in Touch
                    </button>
                </div>

                <!-- Stats Cards -->
                <div class="grid grid-cols-2 gap-4 mt-12 fade-up" style="transition-delay: 0.5s">
                    <div class="glass-card p-6">
                        <div class="text-3xl font-serif text-white mb-2">15+</div>
                        <div class="text-[10px] uppercase tracking-widest text-neutral-500">Years Experience</div>
                    </div>
                    <div class="glass-card p-6">
                        <div class="text-3xl font-serif text-white mb-2">50Cr+</div>
                        <div class="text-[10px] uppercase tracking-widest text-neutral-500">Portfolio Value</div>
                    </div>
                </div>
            </div>

            <!-- Right: Image with Glow -->
            <div class="relative flex justify-center lg:justify-end fade-up" style="transition-delay: 0.4s">
                <!-- Background Glow -->
                <div class="absolute inset-0 bg-onyx-gold/20 blur-[100px] rounded-full scale-75 animate-pulse"></div>

                <div
                    class="relative w-full max-w-md aspect-[3/4] rounded-t-[10rem] overflow-hidden border border-white/10 glass-card">
                    <div
                        class="absolute inset-0 bg-gradient-to-t from-onyx-black via-transparent to-transparent z-10 opacity-60">
                    </div>
                    <img src="public/sachin-ingle.jpg" alt="Sachin Ingle"
                        class="w-full h-full object-cover object-top hover:scale-105 transition-transform duration-[1.5s]">

                    <!-- Floating Caption -->
                    <div class="absolute bottom-8 left-8 right-8 z-20">
                        <div class="glass-card p-4 rounded-xl flex items-center justify-between">
                            <div>
                                <div class="text-xs text-onyx-gold uppercase tracking-wider mb-1">Founder</div>
                                <div class="text-white font-serif text-lg">Sachin Ingle</div>
                            </div>
                            <div class="w-8 h-8 rounded-full border border-white/20 flex items-center justify-center">
                                <span class="text-white text-lg">→</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Decorative Elements -->
        <div class="absolute bottom-0 w-full h-32 bg-gradient-to-t from-onyx-black to-transparent pointer-events-none">
        </div>

    </main>

    <script>
        // Spotlight Effect
        const spotlight = document.querySelector('.spotlight-overlay');
        window.addEventListener('mousemove', (e) => {
            spotlight.style.setProperty('--x', `${e.clientX}px`);
            spotlight.style.setProperty('--y', `${e.clientY}px`);
        });

        // Animations on Load
        document.addEventListener('DOMContentLoaded', () => {
            const elements = document.querySelectorAll('.fade-up');
            setTimeout(() => {
                elements.forEach(el => el.classList.add('active'));
            }, 100);
        });
    </script>
</body>

</html>
